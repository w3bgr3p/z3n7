<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GeeTest cache labeler</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#11151b;color:#e8edf4;font:14px system-ui,sans-serif}
    header{position:sticky;top:0;z-index:5;display:flex;gap:9px;align-items:center;padding:10px 14px;background:#1a2029;border-bottom:1px solid #303846}
    button,select{padding:8px 11px;border:1px solid #465368;border-radius:6px;background:#273244;color:#fff;cursor:pointer}
    button:disabled,select:disabled{opacity:.4;cursor:default}
    #status{margin-left:auto;color:#aebbd0}
    #empty{padding:70px;text-align:center;color:#8390a4}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;padding:18px}
    #mainPanel,#sidePanel{min-width:0}
    #sampleTitle{display:flex;align-items:center;gap:9px;margin:0 0 12px}
    #typeBadge{padding:3px 8px;border-radius:10px;background:#415b84;color:#fff;font-size:12px}
    #sampleId{color:#aebbd0}
    #canvasBox{position:relative;display:inline-block;max-width:100%;line-height:0;background:#080a0d;border:1px solid #3b4657}
    #canvas{display:block;max-width:100%;height:auto;min-width:100px;cursor:crosshair}
    .marker{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;display:grid;place-items:center;background:#ffd43b;color:#111;font:bold 12px system-ui;border:2px solid #111;pointer-events:none}
    aside{background:#1a2029;border:1px solid #303846;border-radius:8px;padding:12px}
    .target{padding:8px;margin-bottom:8px;border:2px solid transparent;border-radius:7px;background:#fff;color:#111}
    .target.active{border-color:#ffd43b}.target.done{opacity:.45}
    .target img{display:block;width:90px;height:90px;object-fit:contain;margin:auto}
    .target b{display:block;text-align:center;margin-top:5px}
    #prompt{display:block;width:100%;max-height:190px;object-fit:contain;margin-bottom:12px;background:#fff;border-radius:6px}
    #nineGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .nine-item{padding:5px;background:#fff;border:3px solid transparent}
    .nine-item.selected{border-color:#ffd43b;background:#fff3a8}
    .nine-item img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain}
    #error{padding:14px;border:1px solid #a84f59;border-radius:7px;background:#3b2025;color:#ffccd1;white-space:pre-wrap}
    #notice{min-height:20px;margin-top:10px;color:#84d39a}
    .hint{margin-top:12px;color:#8d9bb0;line-height:1.5}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <header>
    <button id="open">Выбрать geetest_cache</button>
    <select id="typeFilter" disabled>
      <option value="all">Все типы</option>
      <option value="icon">icon</option>
      <option value="nine">nine</option>
    </select>
    <button id="prev" disabled>← Назад</button>
    <button id="undo" disabled>Отменить</button>
    <button id="reset" disabled>Сбросить</button>
    <button id="next" disabled>Дальше →</button>
    <span id="status">Папка не выбрана</span>
  </header>

  <main id="empty">Выберите корневую папку <b>geetest_cache</b></main>
  <main id="workspace" class="layout" hidden>
    <section id="mainPanel">
      <h3 id="sampleTitle"><span id="typeBadge"></span><span id="sampleId"></span></h3>
      <div id="error" hidden></div>
      <div id="iconEditor" hidden>
        <div id="canvasBox"><img id="canvas" alt="GeeTest canvas"></div>
        <div class="hint">Кликайте объекты в порядке, указанном справа. После последней точки решение сохранится автоматически.</div>
      </div>
      <div id="nineEditor" hidden>
        <img id="prompt" alt="GeeTest prompt">
        <div id="nineGrid"></div>
        <div class="hint">Выберите нужное количество изображений. Решение сохранится автоматически.</div>
      </div>
      <div id="notice"></div>
    </section>
    <aside id="sidePanel"></aside>
  </main>

  <script>
    const $=id=>document.getElementById(id);
    const supportedTypes=new Set(['icon','nine']);
    let rootHandle=null;
    let samples=[];
    let visibleSamples=[];
    let index=0;
    let points=[];
    let selectedIndices=[];

    const asImage=value=>{
      if(typeof value!=='string'||!value.trim())throw new Error('Пустое изображение');
      return value.startsWith('data:')?value:`data:image/png;base64,${value}`;
    };

    async function readText(handle){
      return (await handle.getFile()).text();
    }

    async function exists(dir,name){
      try{await dir.getFileHandle(name);return true}catch{return false}
    }

    async function readJson(dir,name){
      const handle=await dir.getFileHandle(name);
      try{return JSON.parse(await readText(handle))}
      catch(error){throw new Error(`${name}: некорректный JSON (${error.message})`)}
    }

    function validateSource(entry){
      const declared=entry.request?.data?.captcha_type;
      if(declared&&declared!==entry.type)
        throw new Error(`Тип папки ${entry.type} не совпадает с request.json: ${declared}`);
      if(entry.imgs?.type&&entry.imgs.type!==entry.type)
        throw new Error(`Тип imgs.json ${entry.imgs.type} не совпадает с папкой ${entry.type}`);
      if(entry.type==='icon'){
        if(typeof entry.imgs?.canvas!=='string')throw new Error('imgs.json: отсутствует canvas');
        if(!Array.isArray(entry.imgs?.tips)||!entry.imgs.tips.length)
          throw new Error('imgs.json: отсутствует непустой массив tips');
      }
      if(entry.type==='nine'){
        if(typeof entry.imgs?.prompt!=='string')throw new Error('imgs.json: отсутствует prompt');
        if(!Array.isArray(entry.imgs?.items)||entry.imgs.items.length!==9)
          throw new Error('imgs.json: items должен содержать 9 изображений');
        const count=Number(entry.request?.data?.nine_nums);
        if(!Number.isInteger(count)||count<1||count>9)
          throw new Error('request.json: nine_nums должен быть числом от 1 до 9');
      }
    }

    async function loadEntry(type,id,dir){
      const entry={type,id,dir,request:null,imgs:null,solution:null,error:null,solutionError:null};
      try{
        entry.request=await readJson(dir,'request.json');
        entry.imgs=await readJson(dir,'imgs.json');
        validateSource(entry);
        if(await exists(dir,'solution.json')){
          try{entry.solution=await readJson(dir,'solution.json')}
          catch(error){entry.solutionError=error.message}
        }
      }catch(error){entry.error=error.message}
      return entry;
    }

    async function discover(root){
      const result=[];
      for await(const [type,typeHandle] of root.entries()){
        if(typeHandle.kind!=='directory'||!supportedTypes.has(type))continue;
        for await(const [id,sampleHandle] of typeHandle.entries()){
          if(sampleHandle.kind!=='directory')continue;
          if(await exists(sampleHandle,'solved.json'))continue;
          result.push(await loadEntry(type,id,sampleHandle));
        }
      }
      return result.sort((a,b)=>a.type.localeCompare(b.type)||a.id.localeCompare(b.id));
    }

    function validIconSolution(entry,solution){
      if(!solution||solution.type!=='icon'||solution.sample_id!==entry.id)return false;
      const tips=entry.imgs.tips.length;
      return Array.isArray(solution.points)&&solution.points.length===tips&&
        solution.points.every((p,i)=>p&&p.index===i+1&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&p.x>=0&&p.y>=0);
    }

    function validNineSolution(entry,solution){
      const required=Number(entry.request.data.nine_nums);
      if(!solution||solution.type!=='nine'||solution.sample_id!==entry.id||
         !Array.isArray(solution.selected_indices)||solution.selected_indices.length!==required)return false;
      const unique=new Set(solution.selected_indices);
      return unique.size===required&&solution.selected_indices.every(value=>
        Number.isInteger(value)&&value>=0&&value<entry.imgs.items.length);
    }

    function isCompleted(entry){
      if(entry.error||entry.solutionError)return false;
      return entry.type==='icon'
        ?validIconSolution(entry,entry.solution)
        :validNineSolution(entry,entry.solution);
    }

    function updateStatus(){
      const done=samples.filter(isCompleted).length;
      const current=visibleSamples[index];
      $('status').textContent=`всего ${samples.length} · размечено ${done} · осталось ${samples.length-done}`+
        (current?` · ${index+1}/${visibleSamples.length}`:'');
      $('prev').disabled=index<=0;
      $('next').disabled=index>=visibleSamples.length-1;
      $('typeFilter').disabled=!rootHandle;
    }

    function applyFilter(preferredKey){
      const filter=$('typeFilter').value;
      visibleSamples=samples.filter(item=>filter==='all'||item.type===filter);
      const preferred=preferredKey?visibleSamples.findIndex(item=>`${item.type}/${item.id}`===preferredKey):-1;
      index=preferred>=0?preferred:0;
      loadCurrent();
    }

    function clearEditors(){
      $('error').hidden=true;
      $('iconEditor').hidden=true;
      $('nineEditor').hidden=true;
      $('sidePanel').innerHTML='';
      $('notice').textContent='';
      document.querySelectorAll('.marker').forEach(node=>node.remove());
    }

    function renderMarkers(entry){
      document.querySelectorAll('.marker').forEach(node=>node.remove());
      const width=Number(entry.solution?.canvas_width)||$('canvas').naturalWidth||1;
      const height=Number(entry.solution?.canvas_height)||$('canvas').naturalHeight||1;
      for(const point of points){
        const marker=document.createElement('span');
        marker.className='marker';
        marker.textContent=point.index;
        marker.style.left=`${point.x/width*100}%`;
        marker.style.top=`${point.y/height*100}%`;
        $('canvasBox').appendChild(marker);
      }
    }

    function renderIcon(entry,initialize=false){
      $('iconEditor').hidden=false;
      if(initialize){
        points=validIconSolution(entry,entry.solution)
          ?entry.solution.points.map(point=>({...point}))
          :[];
      }
      $('canvas').src=asImage(entry.imgs.canvas);
      $('canvas').onload=()=>renderMarkers(entry);
      $('sidePanel').innerHTML=entry.imgs.tips.map((src,i)=>`
        <div class="target ${i===points.length?'active':''} ${i<points.length?'done':''}">
          <img src="${asImage(src)}" alt="Объект ${i+1}"><b>Объект ${i+1}</b>
        </div>`).join('');
      renderMarkers(entry);
      $('undo').disabled=!points.length;
      $('reset').disabled=!points.length&&!entry.solution;
    }

    function renderNine(entry,initialize=false){
      $('nineEditor').hidden=false;
      if(initialize){
        selectedIndices=validNineSolution(entry,entry.solution)
          ?[...entry.solution.selected_indices]
          :[];
      }
      $('prompt').src=asImage(entry.imgs.prompt);
      $('nineGrid').innerHTML=entry.imgs.items.map((src,i)=>`
        <button class="nine-item ${selectedIndices.includes(i)?'selected':''}" data-index="${i}" title="Ячейка ${i+1}">
          <img src="${asImage(src)}" alt="Ячейка ${i+1}">
        </button>`).join('');
      $('sidePanel').innerHTML=`Нужно выбрать: <b>${entry.request.data.nine_nums}</b><br>Выбрано: <b id="selectedCount">${selectedIndices.length}</b>`;
      $('undo').disabled=!selectedIndices.length;
      $('reset').disabled=!selectedIndices.length&&!entry.solution;
    }

    function loadCurrent(){
      clearEditors();
      const entry=visibleSamples[index];
      if(!entry){
        $('workspace').hidden=true;
        $('empty').hidden=false;
        $('empty').textContent=samples.length?'В выбранном фильтре нет сэмплов':'Нет нерешённых сэмплов типов icon и nine';
        updateStatus();
        return;
      }
      $('empty').hidden=true;
      $('workspace').hidden=false;
      $('typeBadge').textContent=entry.type;
      $('sampleId').textContent=entry.id;
      if(entry.error||entry.solutionError){
        $('error').hidden=false;
        $('error').textContent=entry.error||`solution.json: ${entry.solutionError}`;
        $('undo').disabled=true;
        $('reset').disabled=!entry.solution&&!entry.solutionError;
      }else if(entry.type==='icon')renderIcon(entry,true);
      else renderNine(entry,true);
      updateStatus();
    }

    async function writeSolution(entry,solution){
      const handle=await entry.dir.getFileHandle('solution.json',{create:true});
      const writable=await handle.createWritable();
      await writable.write(JSON.stringify(solution,null,2));
      await writable.close();
      entry.solution=solution;
      entry.solutionError=null;
      $('notice').textContent='solution.json сохранён';
      updateStatus();
    }

    async function removeSolution(entry){
      if(await exists(entry.dir,'solution.json')){
        try{await entry.dir.removeEntry('solution.json')}catch(error){
          throw new Error(`Не удалось удалить solution.json: ${error.message}`);
        }
      }
      entry.solution=null;
      entry.solutionError=null;
      $('notice').textContent='';
      updateStatus();
    }

    $('open').onclick=async()=>{
      if(!window.showDirectoryPicker){
        alert('Откройте страницу в Chrome/Edge через localhost.');
        return;
      }
      try{
        rootHandle=await window.showDirectoryPicker({mode:'readwrite'});
        samples=await discover(rootHandle);
        $('typeFilter').value='all';
        applyFilter();
      }catch(error){
        if(error.name!=='AbortError')alert(`Не удалось открыть cache: ${error.message}`);
      }
    };

    $('canvas').onclick=async event=>{
      const entry=visibleSamples[index];
      if(!entry||entry.type!=='icon'||points.length>=entry.imgs.tips.length)return;
      const rect=$('canvas').getBoundingClientRect();
      const width=$('canvas').naturalWidth;
      const height=$('canvas').naturalHeight;
      const x=Math.max(0,Math.min(width-1,Math.round((event.clientX-rect.left)*width/rect.width)));
      const y=Math.max(0,Math.min(height-1,Math.round((event.clientY-rect.top)*height/rect.height)));
      points.push({index:points.length+1,x,y});
      entry.solution=null;
      renderIcon(entry);
      if(points.length===entry.imgs.tips.length){
        const savedPoints=points.map(point=>({...point}));
        await writeSolution(entry,{
          version:1,type:'icon',sample_id:entry.id,
          canvas_width:width,canvas_height:height,points:savedPoints
        });
        points=savedPoints;
        renderIcon(entry);
        $('notice').textContent='solution.json сохранён';
      }
    };

    $('nineGrid').onclick=async event=>{
      const button=event.target.closest('.nine-item');
      const entry=visibleSamples[index];
      if(!button||!entry||entry.type!=='nine')return;
      if(entry.solution)await removeSolution(entry);
      const value=Number(button.dataset.index);
      const existing=selectedIndices.indexOf(value);
      if(existing>=0)selectedIndices.splice(existing,1);
      else{
        const required=Number(entry.request.data.nine_nums);
        if(selectedIndices.length>=required)return;
        selectedIndices.push(value);
      }
      entry.solution=null;
      renderNine(entry);
      const required=Number(entry.request.data.nine_nums);
      if(selectedIndices.length===required){
        const saved=[...selectedIndices];
        await writeSolution(entry,{
          version:1,type:'nine',sample_id:entry.id,
          item_count:entry.imgs.items.length,required_count:required,
          selected_indices:saved
        });
        selectedIndices=saved;
        renderNine(entry);
        $('notice').textContent='solution.json сохранён';
      }
    };

    $('prev').onclick=()=>{if(index>0){index--;loadCurrent()}};
    $('next').onclick=()=>{if(index<visibleSamples.length-1){index++;loadCurrent()}};
    $('typeFilter').onchange=()=>applyFilter();

    $('undo').onclick=async()=>{
      const entry=visibleSamples[index];
      if(!entry)return;
      await removeSolution(entry);
      if(entry.type==='icon'&&points.length)points.pop();
      if(entry.type==='nine'&&selectedIndices.length)selectedIndices.pop();
      entry.solution=null;
      if(entry.type==='icon'){
        const partial=[...points];
        renderIcon(entry);
        points=partial;
      }else{
        const partial=[...selectedIndices];
        renderNine(entry);
        selectedIndices=partial;
      }
    };

    $('reset').onclick=async()=>{
      const entry=visibleSamples[index];
      if(!entry)return;
      await removeSolution(entry);
      points=[];
      selectedIndices=[];
      loadCurrent();
    };

    document.addEventListener('keydown',event=>{
      if(event.key==='ArrowLeft')$('prev').click();
      if(event.key==='ArrowRight')$('next').click();
      if(event.key==='Backspace'){event.preventDefault();$('undo').click()}
    });
  </script>
</body>
</html>
